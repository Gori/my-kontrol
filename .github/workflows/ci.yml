name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Firmware
        run: make -C firmware
      - name: Firmware host tests
        run: make -C firmware test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web installer tests
        run: cd web && node --test test/*.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ableton script tests
        run: cd daw/ableton && python -m unittest
      - name: Package
        run: |
          VERSION=$(sed -n 's/.*MK_VERSION "\(.*\)"/\1/p' firmware/core/version.h)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p dist
          cp firmware/build/m32/my-kontrol-m32-$VERSION.bin dist/
          (cd daw/ableton && zip -r ../../dist/MyKontrol-Ableton-$VERSION.zip MyKontrol -x '*__pycache__*')
          python3 tools/publish_web.py m32 dist/my-kontrol-m32-$VERSION.bin $VERSION "$(git log -1 --format=%s)"
      - uses: actions/upload-artifact@v4
        with:
          name: my-kontrol-${{ env.VERSION }}
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: web

  pages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          prerelease: ${{ contains(github.ref, 'beta') }}
          generate_release_notes: true
